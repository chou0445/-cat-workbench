<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#D4977A">
  <meta name="apple-mobile-web-app-title" content="猫咪工作台">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="猫咪工作台">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>猫咪工作台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <!-- 页面容器 -->
    <div id="page-container"></div>

    <!-- 底部导航栏 -->
    <nav class="tab-bar" id="tabBar">
      <div class="tab-item active" data-tab="home">
        <div class="tab-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5c-1.2 0-2.3.4-3.2 1.1-.6-.4-1.3-.6-2.1-.6-2.1 0-3.8 1.7-3.8 3.8 0 .5.1 1 .3 1.5-.8.5-1.3 1.4-1.3 2.4 0 1.6 1.3 2.9 2.9 2.9h.2v6.4c0 .8.7 1.5 1.5 1.5h11c.8 0 1.5-.7 1.5-1.5v-6.4h.2c1.6 0 2.9-1.3 2.9-2.9 0-1-.5-1.9-1.3-2.4.2-.5.3-1 .3-1.5 0-2.1-1.7-3.8-3.8-3.8-.8 0-1.5.2-2.1.6-.9-.7-2-1.1-3.2-1.1zm-5.3 2.5c.5 0 .9.1 1.3.4-.6.8-1 1.8-1 2.9v.1c-.4.1-.8.2-1.1.4-.2-.3-.3-.6-.3-1 0-1.2 1-2.2 2.1-2.8zm10.6 0c1.1.6 2.1 1.6 2.1 2.8 0 .4-.1.7-.3 1-.3-.2-.7-.3-1.1-.4v-.1c0-1.1-.4-2.1-1-2.9.4-.3.8-.4 1.3-.4zM12 6.5c1.9 0 3.5 1.6 3.5 3.5s-1.6 3.5-3.5 3.5S8.5 11.9 8.5 10s1.6-3.5 3.5-3.5z"/>
          </svg>
        </div>
        <span class="tab-label">首页</span>
      </div>
      <div class="tab-item" data-tab="service">
        <div class="tab-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="8" height="8" rx="2"/>
            <rect x="13" y="3" width="8" height="8" rx="2"/>
            <rect x="3" y="13" width="8" height="8" rx="2"/>
            <rect x="13" y="13" width="8" height="8" rx="2"/>
          </svg>
        </div>
        <span class="tab-label">服务</span>
      </div>
      <div class="tab-item" data-tab="circle">
        <div class="tab-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"/>
            <circle cx="18" cy="6" r="2.2" fill="currentColor" opacity="0.5"/>
          </svg>
        </div>
        <span class="tab-label">猫圈</span>
      </div>
    </nav>

    <!-- PWA 安装按钮 -->
    <div id="pwa-install-btn" style="display:none;position:fixed;bottom:80px;right:16px;z-index:100;background:#D4977A;color:#fff;border-radius:40px;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(212,151,122,0.4);cursor:pointer;align-items:center;gap:8px;" onclick="pwaInstall()">
      <span style="font-size:18px;">📱</span>
      <span>安装App</span>
    </div>
  </div>

  <script>
    window.__jsErrors = [];
    window.addEventListener('error', function(e) {
      window.__jsErrors.push({msg: e.message, file: e.filename, line: e.lineno, col: e.colno});
    });
  </script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages-home.js"></script>
  <script src="js/pages-service.js"></script>
  <script src="js/pages-circle.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 注册 Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', {scope: './'}).catch(function(e) {
        console.warn('SW register failed:', e);
      });
    }

    // PWA 安装引导
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      // 显示安装按钮
      var btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'flex';
    });

    function pwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function() {
          deferredPrompt = null;
          var btn = document.getElementById('pwa-install-btn');
          if (btn) btn.style.display = 'none';
        });
      }
    }

    window.addEventListener('appinstalled', function() {
      var btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    });
  </script>
</body>
</html>
