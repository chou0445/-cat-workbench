<body>
  <div id="app">
    <!-- 页面容器 -->

    <!-- 底部导航栏 -->

    <!-- PWA 安装按钮 -->
    <div id="pwa-install-btn" style="display:none;position:fixed;bottom:80px;right:16px;z-index:100;background:#D4977A;color:#fff;border-radius:40px;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(212,151,122,0.4);cursor:pointer;align-items:center;gap:8px;" onclick="pwaInstall()">
      <span style="font-size:18px;">📱</span>
      <span>安装App</span>
    </div>
  </div>

  <script>
    window.__jsErrors = [];
    window.addEventListener('error', function(e) {
      window.__jsErrors.push({msg: e.message, file: e.filename, line: e.lineno, col: e.colno});
    });

    // 阻止 WebView 下拉刷新
    // 原理：WebView判断 canScrollVertically(-1)，滚动到顶时返回false才触发刷新
    // 我们在page-container到顶时强制保留1px滚动空间，让WebView始终认为"还能滚"
    (function() {
      var pc = document.getElementById('page-container');
      function fixScroll() {
        if (!pc) { pc = document.getElementById('page-container'); if (!pc) return; }
        if (pc.scrollTop <= 0) pc.scrollTop = 1;
      }
      // 每次滚动后检查
      pc.addEventListener('scroll', fixScroll, { passive: true });
      // touchstart时也检查（防止在顶部开始下拉）
      pc.addEventListener('touchstart', fixScroll, { passive: true });
      // 初始检查
      fixScroll();
    })();
  </script>
  <script src="js/store.js?v=20260803a"></script>
  <script src="js/charts.js?v=20260803a"></script>
  <script src="js/router.js?v=20260803a"></script>
  <script src="js/pages-home.js?v=20260803a"></script>
  <script src="js/pages-service.js?v=20260803a"></script>
  <script src="js/pages-circle.js?v=20260803a"></script>
  <script src="js/app.js?v=20260803a"></script>
  <script>
    // ========================================
    // Service Worker 注册
    // ========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/-cat-workbench/sw.js', {scope: '/-cat-workbench/'}).then(function(reg) {
          console.log('[PWA] SW registered, scope:', reg.scope);
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', function() {
                console.log('[PWA] SW state:', newWorker.state);
              });
            }
          });
        }).catch(function(e) {
          console.warn('[PWA] SW register failed:', e);
        });
      });
    }

    // ========================================
    // PWA 安装引导
    // 核心问题：beforeinstallprompt 可能在首页渲染前就触发
    // 解决：用全局变量记录状态 + 轮询检测按钮 + 5秒兜底横幅
    // ========================================
    var deferredPrompt = null;
    var installAvailable = false;

    // 立即监听 beforeinstallprompt（在任何渲染之前）
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      installAvailable = true;
      console.log('[PWA] beforeinstallprompt fired');
      applyInstallUI();
    });

    // 首页渲染后检查是否已捕获到安装事件
    function applyInstallUI() {
      var btn = document.getElementById('pwa-install-btn');
      if (btn && installAvailable) {
        btn.style.display = 'flex';
      }
      if (installAvailable) {
        showInstallBanner();
      }
    }

    // 轮询检测按钮是否已渲染（首页是 JS 动态渲染的）
    var pollCount = 0;
    var pollTimer = setInterval(function() {
      pollCount++;
      var btn = document.getElementById('pwa-install-btn');
      if (btn) {
        if (installAvailable) {
          btn.style.display = 'flex';
          showInstallBanner();
        }
        clearInterval(pollTimer);
      }
      if (pollCount > 30) clearInterval(pollTimer); // 15秒后停止
    }, 500);

    // 5秒后如果 beforeinstallprompt 未触发，显示手动安装横幅
    setTimeout(function() {
      if (!installAvailable && !isStandalone()) {
        console.log('[PWA] beforeinstallprompt not fired after 5s, showing fallback');
        showManualInstallBanner();
      }
    }, 5000);

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function showInstallBanner() {
      if (document.getElementById('pwa-install-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'pwa-install-banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#D4977A;color:white;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.15);';
      banner.innerHTML = '<span>📥 安装「猫咪工作台」到主屏幕</span>';
      var btnGroup = document.createElement('div');
      btnGroup.style.cssText = 'display:flex;align-items:center;gap:8px;';
      var installBtn = document.createElement('button');
      installBtn.textContent = '安装';
      installBtn.style.cssText = 'background:white;color:#D4977A;border:none;padding:6px 16px;border-radius:16px;font-weight:600;font-size:14px;cursor:pointer;';
      installBtn.onclick = pwaInstall;
      var closeBtn = document.createElement('button');
      closeBtn.textContent = '✕';
      closeBtn.style.cssText = 'background:transparent;color:white;border:none;font-size:18px;cursor:pointer;opacity:0.7;';
      closeBtn.onclick = function() { banner.remove(); document.body.style.paddingTop = ''; };
      btnGroup.appendChild(installBtn);
      btnGroup.appendChild(closeBtn);
      banner.appendChild(btnGroup);
      document.body.appendChild(banner);
      document.body.style.paddingTop = '48px';
    }

    function showManualInstallBanner() {
      if (document.getElementById('pwa-manual-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'pwa-manual-banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#A8BBA0;color:white;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.15);';
      banner.innerHTML = '<span>💡 请使用 Chrome 浏览器打开以安装应用</span>';
      var closeBtn = document.createElement('button');
      closeBtn.textContent = '✕';
      closeBtn.style.cssText = 'background:transparent;color:white;border:none;font-size:18px;cursor:pointer;opacity:0.7;';
      closeBtn.onclick = function() { banner.remove(); document.body.style.paddingTop = ''; };
      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
      document.body.style.paddingTop = '44px';
    }

    function pwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice) {
          console.log('[PWA] user choice:', choice.outcome);
          deferredPrompt = null;
          installAvailable = false;
          var btn = document.getElementById('pwa-install-btn');
          if (btn) btn.style.display = 'none';
          var b1 = document.getElementById('pwa-install-banner');
          if (b1) b1.remove();
          var b2 = document.getElementById('pwa-manual-banner');
          if (b2) b2.remove();
          document.body.style.paddingTop = '';
        });
      } else {
        alert('请使用 Chrome 浏览器打开以安装应用');
      }
    }

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] installed successfully');
      deferredPrompt = null;
      installAvailable = false;
      var btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
      var b1 = document.getElementById('pwa-install-banner');
      if (b1) b1.remove();
      var b2 = document.getElementById('pwa-manual-banner');
      if (b2) b2.remove();
      document.body.style.paddingTop = '';
    });

    // 已安装则隐藏所有安装提示
    if (isStandalone()) {
      console.log('[PWA] running in standalone mode');
      document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('pwa-install-btn');
        if (btn) btn.style.display = 'none';
      });
    }
  </script>
</body>
